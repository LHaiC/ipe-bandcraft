name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    # Unit tests are dependency-free: they run on every PR without Ipe/TeX.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest tests/unit -q

  integration:
    # Real Ipe + TeX. Installs Ipe via winget and MiKTeX; tests self-skip if
    # a tool is missing, so a provisioning failure shows as skipped — not
    # silently green.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ipe
        run: winget install --id OtfriedCheong.Ipe -e --accept-source-agreements --accept-package-agreements --disable-interactivity
        continue-on-error: true
      - name: Install MiKTeX
        run: winget install --id MiKTeX.MiKTeX -e --accept-source-agreements --accept-package-agreements --disable-interactivity
        continue-on-error: true
      - run: uv sync --locked
      - name: Doctor + integration tests (PATH refreshed for winget installs)
        shell: pwsh
        run: |
          # winget-installed tools land in User/Machine PATH, which the
          # already-running runner process does not see — re-read it here.
          $env:PATH = [Environment]::GetEnvironmentVariable("PATH","Machine") +
                      ";" + [Environment]::GetEnvironmentVariable("PATH","User")
          uv run ipe-bindcraft doctor
          uv run pytest tests/integration -v -rs
