name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    # Unit tests are dependency-free: they run on every PR without Ipe/TeX.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest tests/unit -q

  integration:
    # Real Ipe + TeX. Installs Ipe via winget and MiKTeX; tests self-skip if
    # a tool is missing, so a provisioning failure shows as skipped — not
    # silently green.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Ipe
        run: winget install --id OtfriedCheong.Ipe -e --accept-source-agreements --accept-package-agreements --disable-interactivity
        continue-on-error: true
      - name: Install MiKTeX
        shell: pwsh
        continue-on-error: true
        run: |
          winget install --id MiKTeX.MiKTeX -e --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            Write-Host "winget MiKTeX failed ($LASTEXITCODE); falling back to chocolatey"
            choco install miktex -y --no-progress
          }
      - name: Refresh PATH and enable MiKTeX auto-install
        shell: pwsh
        run: |
          # winget/choco installs update User/Machine PATH, which the
          # already-running runner process does not see — re-read it.
          $env:PATH = [Environment]::GetEnvironmentVariable("PATH","Machine") +
                      ";" + [Environment]::GetEnvironmentVariable("PATH","User")
          if (Get-Command initexmf -ErrorAction SilentlyContinue) {
            # on-the-fly package install must be non-interactive in CI
            initexmf --set-config-value="[MPM]AutoInstall=1"
          } else {
            Write-Host "initexmf not found on PATH — pdflatex will be unavailable"
          }
      - run: uv sync --locked
      - name: Doctor + integration tests
        shell: pwsh
        run: |
          $env:PATH = [Environment]::GetEnvironmentVariable("PATH","Machine") +
                      ";" + [Environment]::GetEnvironmentVariable("PATH","User")
          uv run ipe-bindcraft doctor
          uv run pytest tests/integration -v -rs
