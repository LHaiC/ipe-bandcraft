[project]
name = "ipe-bindcraft"
version = "0.1.0"
description = "Windows-first Ipe MCP for academic paper figures"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.7,<3",
    "lxml>=5.2,<7",
    "pypdf>=4.2,<7",
    "platformdirs>=4.2,<6",
]

[project.scripts]
ipe-bindcraft = "ipe_bindcraft.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel]
packages = ["src/ipe_bindcraft"]

[dependency-groups]
dev = [
    "pytest>=8.2,<10",
    "jsonschema>=4.22,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring real Ipe/TeX on PATH or configured",
    "gui: tests requiring the Ipe GUI",
]
